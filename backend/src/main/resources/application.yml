spring:
  application:
    name: nutrition-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nutrition_db?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      idle-timeout: 300000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    com.nutrition: DEBUG
    org.hibernate.SQL: DEBUG

app:
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:http://localhost:5173/login}
  admin:
    email: ${ADMIN_EMAIL:admin@nutrimunch.com}
    password: ${ADMIN_PASSWORD:AdminPass123!}

google:
  script:
    url: ${GOOGLE_SCRIPT_URL}
    api-key: ${GOOGLE_SCRIPT_API_KEY}
  client:
    id: ${GOOGLE_CLIENT_ID}

gemma:
  api:
    key: ${GEMMA_API_KEY:mock-key}
    model: ${GEMMA_MODEL:gemini-1.5-flash}

