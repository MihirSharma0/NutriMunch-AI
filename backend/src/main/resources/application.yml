spring:
  application:
    name: nutrition-api
  config:
    import: optional:file:.env[.properties],optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nutrition_db?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: nutrimunch-pool
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 300000
      idle-timeout: 120000
      keepalive-time: 60000
      validation-timeout: 3000
      leak-detection-threshold: 25000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    com.nutrition: INFO
    org.hibernate.SQL: WARN

app:
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:http://localhost:5173/login}
    origin: ${FRONTEND_ORIGIN:https://nutrimunch-ai.vercel.app,http://localhost:5173,http://localhost:5174}
  http:
    # Timeouts applied to every outbound RestTemplate call (AI, barcode lookup, email).
    # A bare RestTemplate has no timeouts, so one stalled third party could pin a request
    # thread indefinitely. Read timeout is generous because AI vision calls are slow.
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:60000}
  request:
    # Largest accepted request body in bytes (16 MiB). Image analysis uploads a base64
    # data URL inside a JSON body, so this must stay generous enough for a phone photo.
    max-body-bytes: ${MAX_REQUEST_BODY_BYTES:16777216}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:admin123}

google:
  script:
    url: ${GOOGLE_SCRIPT_URL}
    api-key: ${GOOGLE_SCRIPT_API_KEY}
  client:
    id: ${GOOGLE_CLIENT_ID}

gemma:
  api:
    key: ${GEMMA_API_KEY:mock-key}
    model: ${GEMMA_MODEL:gemini-2.5-flash}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TpZmiL9G36VVd4}
